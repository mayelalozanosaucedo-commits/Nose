<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universo Sandbox</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070b17;color:#dcefff;font:13px Verdana,Arial,sans-serif}canvas{display:block;width:100%;height:100%}aside{position:absolute;top:10px;left:10px;z-index:3;padding:14px;width:min(330px,calc(100vw - 20px));background:#0a1724e8;border:1px solid #607b9b;border-radius:7px;box-shadow:0 8px 20px #0008}aside h1{margin:0 0 5px;font-size:20px;color:#afd7fa}p{font-size:11px;color:#bbcae1;line-height:1.6}button,select{padding:8px 9px;background:#2c496b;border:1px solid #91b4ce;color:white;border-radius:5px;cursor:pointer}button:hover{background:#376b91}button:active{transform:scale(.96)}.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}a{color:#c8e9fb}small{opacity:.8}#status{margin-top:8px;color:#8bd8ed}</style></head><body><canvas id="sky"></canvas><aside><a href="/">← Volver al portal de juegos</a><h1>🪐 Universo Sandbox</h1><p>Crea estrellas, planetas y lunas. Selecciona un cuerpo y toca el espacio. Arrastra para impulsar objetos; la gravedad los mueve.</p><div class="bar"><button data-kind="star">☀️ Estrella</button><button data-kind="planet">🌍 Planeta</button><button data-kind="moon">🌙 Luna</button><button data-kind="comet">☄️ Cometa</button></div><div class="bar"><button id="play">⏸ Pausa</button><button id="reset">Reiniciar</button><button id="grav">Gravedad: 1×</button></div><small>Usa el dedo o ratón para colocar. Arrastra y suelta para darle impulso.</small><div id="status">Un universo por descubrir.</div></aside><script>
const cv=document.querySelector('#sky'),g=cv.getContext('2d');let W,H,ratio=1;function resize(){ratio=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*ratio;cv.height=H*ratio;g.setTransform(ratio,0,0,ratio,0,0);}addEventListener('resize',resize);resize();let bodies=[],stars=[],kind='planet',paused=false,grav=1,last=performance.now(),touch=null;const colors=['#74c1fb','#bd8fd4','#dbaf7b','#8bd3a3'];for(let i=0;i<240;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.25,a:Math.random()*.7+.3});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(c=>c.style.outline='none');b.style.outline='2px solid #f7df96';document.querySelector('#status').textContent='Elegido: '+kind;});document.querySelector('[data-kind=planet]').click();function make(x,y,vx,vy,type){const configs={star:[15,3000,'#ffe1a0'],planet:[8,70,colors[Math.random()*colors.length|0]],moon:[4,13,'#c5ced7'],comet:[3,3,'#b7cdec']};const [r,m,c]=configs[type];bodies.push({x,y,vx,vy,r,m,c,type,trail:[]});if(bodies.length>130)bodies.shift();}
cv.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointerup',e=>{if(!touch)return;make(touch.x,touch.y,(e.clientX-touch.x)*.13,(e.clientY-touch.y)*.13,kind);touch=null;});document.querySelector('#play').onclick=()=>{paused=!paused;document.querySelector('#play').textContent=paused?'▶ Reanudar':'⏸ Pausa';};document.querySelector('#reset').onclick=()=>{bodies=[];};document.querySelector('#grav').onclick=()=>{grav=grav===1?2:grav===2?.5:1;document.querySelector('#grav').textContent='Gravedad: '+grav+'×';};make(W/2,H/2,0,0,'star');make(W/2+115,H/2,0,-2.7,'planet');make(W/2+145,H/2,0,-4.9,'moon');function loop(now){requestAnimationFrame(loop);let dt=Math.min(.04,(now-last)/1000);last=now;if(!paused){for(const b of bodies){let ax=0,ay=0;for(const a of bodies){if(a===b)continue;const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+800,dd=Math.sqrt(d2),f=Math.min(50,450*a.m/(d2*dd))*grav;ax+=dx*f;ay+=dy*f;}b.vx+=ax*dt;b.vy+=ay*dt;b.x+=b.vx*dt*35;b.y+=b.vy*dt*35;b.trail.push([b.x,b.y]);if(b.trail.length>60)b.trail.shift();}}
g.fillStyle='#060b19';g.fillRect(0,0,W,H);for(const a of stars){g.fillStyle=`rgba(227,237,255,${a.a})`;g.fillRect(a.x*W,a.y*H,a.r,a.r);}for(const b of bodies){g.beginPath();for(let i=0;i<b.trail.length;i++){const [x,y]=b.trail[i];if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}g.strokeStyle=b.c+'60';g.lineWidth=1;g.stroke();g.shadowColor=b.c;g.shadowBlur=b.type==='star'?27:6;g.fillStyle=b.c;g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();g.shadowBlur=0;}if(touch){g.strokeStyle='#b5d8fd';g.beginPath();g.moveTo(touch.x,touch.y);g.lineTo(window.event?.clientX||touch.x,window.event?.clientY||touch.y);g.stroke();}document.querySelector('#status').textContent=`${bodies.length} cuerpos · Gravedad ${grav}× · ${paused?'Pausado':'En movimiento'}`;}
requestAnimationFrame(loop);
</script></body></html>
