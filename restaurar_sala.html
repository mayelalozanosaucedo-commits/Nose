<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurar salas Cuboverso</title><style>body{font:16px system-ui;background:#151b22;color:#e9f0ed;max-width:660px;margin:35px auto;padding:0 16px}label{display:block;margin:14px 0 4px}input,button{font:inherit;padding:12px;width:100%;box-sizing:border-box;border:1px solid #69717d;background:#283743;color:#fff;border-radius:7px}button{background:#286c5c;cursor:pointer;margin-top:18px}.note{padding:12px;background:#4d3229}#result{white-space:pre-wrap;padding:12px;background:#1c2731}</style></head><body>
<h1>Restaurar una sala de Cuboverso</h1><p class="note">Usa esta herramienta <b>después</b> de publicar la versión 1.5 con un volumen persistente en Railway. La importación exige la clave administrativa <code>ADMIN_IMPORT_KEY</code> del servidor y rechaza sobrescribir salas existentes.</p>
<label>Dirección de la página nueva</label><input id="server" value="https://nose-production-de5ef24b.up.railway.app/">
<label>Clave administrativa del servidor (mínimo 16 caracteres)</label><input id="key" type="password" autocomplete="off">
<label>¿Qué necesitas restaurar?</label><select id="type" style="width:100%;padding:12px;background:#283743;color:white"><option value="room">Restaurar la sala completa</option><option value="player">Restaurar el inventario de otro jugador después de recuperar la sala</option></select><label>Archivo de respaldo JSON</label><input id="file" type="file" accept="application/json,.json">
<button id="restore">Restaurar desde mi respaldo</button><p id="result"></p>
<script>
const $=id=>document.getElementById(id);$('restore').onclick=async()=>{const file=$('file').files[0];if(!file){$('result').textContent='Selecciona el archivo JSON.';return;}if($('key').value.length<16){$('result').textContent='Falta la clave administrativa.';return;}try{const text=await file.text(),data=JSON.parse(text);if(data.format!=='cuboverso_room_backup_v1')throw Error('El archivo no es un respaldo Cuboverso válido.');const url=new URL($('type').value==='player'?'/api/admin/restore-player':'/api/admin/restore-room',$('server').value);const r=await fetch(url.href,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':$('key').value},body:JSON.stringify(data)});const result=await r.json();$('result').textContent=result.ok?('Respaldo restaurado en sala '+result.code+(result.changes!==undefined?'. Bloques: '+result.changes:'. Perfil: '+result.playerName)):'No se restauró la sala: '+(result.error||'HTTP '+r.status);}catch(e){$('result').textContent='Error: '+e.message;}};
</script></body></html>
